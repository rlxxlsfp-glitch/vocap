<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VOCAP</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17113A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VOCAP">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F5F3FF; --line:#ECE9F7; --ink:#15131F; --muted:#6B6880;
  --accent:#6E4BFF; --accent2:#A26BFF; --accent-ink:#FFFFFF; --soft:#EFEAFF;
  --hl:#EFEAFF; --hl-ink:#5B3BEA;
  --good:#1A8F55; --good-bg:#E6F6EE; --bad:#E0445C; --bad-bg:#FDEDEF; --mid:#A86A00; --mid-bg:#FFF4DD;
  --shadow:0 12px 34px rgba(76,52,170,.08), 0 2px 6px rgba(76,52,170,.04);
  --grad:linear-gradient(90deg,#6E4BFF,#A26BFF);
  --en:'Inter', 'Noto Sans KR', system-ui, sans-serif;
  --ko:'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0B1F; --surface:#17132E; --surface2:#211B42; --line:#2C2552; --ink:#EEEAFB; --muted:#A59FC4;
    --accent:#8D72FF; --accent2:#B58CFF; --accent-ink:#FFFFFF; --soft:#2A2256; --hl:#2A2256; --hl-ink:#C9B9FF;
    --good:#4CC38A; --good-bg:#14322A; --bad:#FF7A8A; --bad-bg:#3A1A26; --mid:#F0B44C; --mid-bg:#3A2E15;
    --shadow:0 12px 34px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0B1F; --surface:#17132E; --surface2:#211B42; --line:#2C2552; --ink:#EEEAFB; --muted:#A59FC4;
  --accent:#8D72FF; --accent2:#B58CFF; --accent-ink:#FFFFFF; --soft:#2A2256; --hl:#2A2256; --hl-ink:#C9B9FF;
  --good:#4CC38A; --good-bg:#14322A; --bad:#FF7A8A; --bad-bg:#3A1A26; --mid:#F0B44C; --mid-bg:#3A2E15;
  --shadow:0 12px 34px rgba(0,0,0,.35);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ko);font-size:16px;line-height:1.6;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent;word-break:keep-all}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:900px;margin:0 auto;padding:0 20px 56px}

/* hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#2E2167 0%,#17113A 45%,#0B0820 100%);color:#fff;text-align:center;padding:64px 20px 56px}
.hero .stars{position:absolute;inset:0;pointer-events:none}
.hero .stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#8F7BFF;opacity:.6}
.hero .book{position:relative;display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);border-radius:999px;padding:6px 16px;font-size:14px;font-weight:600;margin:0}
.hero h1{position:relative;margin:18px 0 6px;font-family:var(--en);font-weight:900;font-size:clamp(76px,17vw,160px);line-height:.95;letter-spacing:-.05em;
  background:linear-gradient(135deg,#A58BFF 0%,#7B5CFF 45%,#B07CFF 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 8px 28px rgba(123,92,255,.45))}
.hero .dayname{display:inline-block;margin:6px 0 14px;padding:6px 20px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;font-family:var(--en);font-weight:800;font-size:clamp(20px,3.6vw,28px);letter-spacing:-.01em}
.hero p{position:relative;margin:0;color:rgba(255,255,255,.75);font-size:16px}

/* home */
.sec{margin-top:48px}
.sec-h{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.sec-h .ic{width:52px;height:52px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--accent)}
.sec h3{font-size:clamp(26px,4.4vw,34px);font-weight:900;letter-spacing:-.03em;margin:8px 0 6px;line-height:1.25}
.sec .desc{color:var(--muted);font-size:16px;margin:0 0 20px}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.mode{display:flex;align-items:center;gap:16px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:18px 20px;min-height:84px;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.mode:hover{border-color:var(--accent);transform:translateY(-2px)}
.mode .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent);flex:none}
.mode .ic svg{width:24px;height:24px}
.mode b{display:block;font-size:17px;font-weight:700}
.mode small{color:var(--muted);font-size:14px;display:block;line-height:1.4;margin-top:2px}
.opts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:8px 16px;font-size:14px;font-weight:600;border-radius:999px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(110,75,255,.3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 18px}
.stat{border-radius:18px;padding:18px 10px;background:var(--surface2);text-align:center}
.stat b{font-family:var(--en);font-size:32px;font-weight:800;display:block;line-height:1.1;color:var(--accent)}
.stat span{font-size:14px;color:var(--muted)}
.stat.l b{color:var(--mid)} .stat.m b{color:var(--good)}
.ov{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin-bottom:8px}
.pill{display:inline-block;background:var(--soft);color:var(--accent);font-weight:700;border-radius:999px;padding:4px 12px;font-size:14px}
.bar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:4px 0 18px}
.bar i{display:block;height:100%;background:var(--grad);width:0;border-radius:99px;transition:width .4s}
.wlist{border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:6px}
.wrow{display:grid;grid-template-columns:10px minmax(120px,28%) 1fr 40px;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.l{background:var(--mid)} .dot.m{background:var(--good)}
.wrow .en{font-family:var(--en);font-weight:700;font-size:17px;word-break:break-word}
.wrow .ko{font-size:14px;color:var(--muted)}
.star{border:0;background:transparent;font-size:20px;width:40px;height:40px;border-radius:50%;color:var(--muted)}
.star:hover{background:var(--surface2)}
.star[aria-pressed="true"]{color:var(--accent)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:14px 0 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.reset{margin-top:16px;border:0;background:var(--surface2);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;color:var(--muted)}

/* mode screen */
.top{display:flex;align-items:center;gap:12px;padding:18px 0 14px}
.iconbtn{border:0;background:var(--surface2);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--ink)}
.top h2{font-size:22px;font-weight:900;letter-spacing:-.02em;margin:0;flex:1}
.btn{border:0;border-radius:999px;padding:14px 22px;font-weight:700;background:var(--grad);color:#fff;min-height:52px;box-shadow:0 8px 22px rgba(110,75,255,.28)}
.btn.ghost{background:var(--surface2);color:var(--ink);box-shadow:none}
.btn.good{background:var(--good);box-shadow:none} .btn.bad{background:var(--bad);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:var(--shadow)}
.prompt-label{font-size:14px;color:var(--muted);margin:0 0 6px;font-weight:500}
.prompt{font-size:22px;font-weight:700;margin:0 0 20px;letter-spacing:-.02em}
.prompt.en{font-family:var(--en);font-size:38px;font-weight:800;letter-spacing:-.03em}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;text-align:left;min-height:62px;font-size:16px}
.choices .choice::before{color:var(--muted);font-size:15px;flex:none}
.choices .choice:nth-child(1)::before{content:'①'} .choices .choice:nth-child(2)::before{content:'②'}
.choices .choice:nth-child(3)::before{content:'③'} .choices .choice:nth-child(4)::before{content:'④'}
.choice.en{font-family:var(--en);font-size:19px;font-weight:700}
.choice:hover{border-color:var(--accent);background:var(--surface2)}
.choice.right{background:var(--good-bg);border-color:var(--good);color:var(--good);font-weight:700}
.choice.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.typein{display:flex;gap:8px}
.typein input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface2);border-radius:16px;padding:13px 16px;font-family:var(--en);font-size:20px;font-weight:600}
.typein input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.feedback{margin-top:16px;padding:14px 18px;border-radius:16px;font-size:16px;font-weight:600}
.feedback.ok{background:var(--good-bg);color:var(--good)}
.feedback.ok::before{content:'✓  '}
.feedback.no{background:var(--bad-bg);color:var(--ink);font-weight:500}
.feedback .en{font-family:var(--en);font-weight:800;font-size:18px}
.done{text-align:center;padding:40px 20px}
.done h3{font-size:34px;font-weight:900;letter-spacing:-.03em;margin:0 0 6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.done p{color:var(--muted);margin:0 0 22px}
.tally{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:4px;color:var(--muted)}
.tally .k{color:var(--good)} .tally .u{color:var(--bad)}
.note{color:var(--muted);font-size:14px;margin:0 0 12px}

/* flashcards */
.fcwrap{perspective:1400px;margin:6px 0 16px}
.fc{position:relative;height:min(52vh,400px);transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:28px;display:grid;place-items:center;padding:28px;text-align:center;box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg);background:var(--surface2)}
.face .big-en{font-family:var(--en);font-weight:900;font-size:clamp(40px,9vw,68px);line-height:1.05;letter-spacing:-.04em;background:linear-gradient(135deg,#7B5CFF,#A26BFF);-webkit-background-clip:text;background-clip:text;color:transparent;padding:4px}
.face .big-ko{font-size:clamp(20px,4.4vw,28px);font-weight:700;line-height:1.55}
.face .corner{position:absolute;top:14px;right:14px;display:flex;gap:4px}
.face .hint{position:absolute;bottom:16px;left:0;right:0;font-size:13px;color:var(--muted);font-weight:600}
.fc.swipe-l{transform:translateX(-120%) rotate(-8deg);opacity:0;transition:transform .25s,opacity .25s}
.fc.swipe-r{transform:translateX(120%) rotate(8deg);opacity:0;transition:transform .25s,opacity .25s}

/* match */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{min-height:100px;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:12px;font-size:15px;box-shadow:var(--shadow);transition:opacity .25s,transform .25s}
.tile.en{font-family:var(--en);font-size:19px;font-weight:800}
.tile.sel{border-color:var(--accent);background:var(--surface2);box-shadow:inset 0 0 0 2px var(--accent)}
.tile.wrong{background:var(--bad-bg);border-color:var(--bad)}
.tile.gone{opacity:0;transform:scale(.85);pointer-events:none}
.timer{font-variant-numeric:tabular-nums}

/* blast */
.arena{position:relative;height:min(56vh,470px);background:radial-gradient(ellipse at 50% 30%,#2E2167 0%,#17113A 55%,#0B0820 100%);border-radius:26px;overflow:hidden;touch-action:manipulation}
.rock{position:absolute;left:0;top:0;padding:12px 18px;border-radius:999px;background:rgba(255,255,255,.1);border:1.5px solid rgba(165,139,255,.6);color:#fff;font-family:var(--en);font-weight:700;font-size:17px;white-space:nowrap;backdrop-filter:blur(4px)}
.rock:hover{border-color:#fff}
.rock.hit{background:var(--good);border-color:var(--good);transform:scale(1.3);opacity:0;transition:all .3s}
.rock.miss{background:rgba(224,68,92,.4);border-color:#FF7A8A}
.ground{position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#E0445C,#FF7A8A);opacity:.8}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700}
.hud b{color:var(--accent);font-family:var(--en);font-size:20px}
.target{background:var(--hl);color:var(--hl-ink);border-radius:18px;padding:14px 18px;margin-top:14px;font-weight:700;font-size:18px;text-align:center}

/* blocks */
.well{position:relative;height:min(46vh,390px);background:var(--surface2);border-radius:26px;overflow:hidden}
.fall{position:absolute;left:50%;transform:translateX(-50%);top:0;padding:12px 24px;background:var(--grad);color:#fff;border-radius:14px;font-family:var(--en);font-weight:800;font-size:20px;white-space:nowrap;box-shadow:0 8px 20px rgba(110,75,255,.35)}
.fall.boom{transform:translateX(-50%) scale(1.4);opacity:0;transition:all .25s}
.stack{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column-reverse}
.sblock{height:38px;margin:0 14px 2px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--en);font-weight:700;color:var(--muted)}

/* gems */
.gembar{display:flex;flex-wrap:wrap;gap:5px;min-height:30px;margin:6px 0 14px}
.gem{width:16px;height:16px;transform:rotate(45deg);border-radius:4px}
.combo{font-weight:800;color:var(--accent)}
.tbar{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:12px}
.tbar i{display:block;height:100%;background:var(--grad);width:100%}

/* test */
.q{padding:22px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.q .qn{font-size:14px;color:var(--muted);font-weight:600;margin:0 0 6px}
.q.correct .qn::after{content:'  정답';color:var(--good);font-weight:800}
.q.incorrect .qn::after{content:'  오답';color:var(--bad);font-weight:800}
.tf{display:flex;gap:12px}
.tf .choice{flex:1;justify-content:center;text-align:center}
.ans{margin-top:10px;font-size:15px;color:var(--bad);font-weight:600}
.ans .en{font-family:var(--en);font-weight:800}
.chk{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 22px}
.chk label{display:flex;gap:8px;align-items:center;background:var(--surface2);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px}
.chk input{accent-color:var(--accent)}
.score{font-family:var(--en);font-size:64px;font-weight:900;line-height:1;letter-spacing:-.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

@media (max-width:600px){
  .modes{grid-template-columns:1fr}
  .choices{grid-template-columns:1fr}
  .wrow{grid-template-columns:10px 1fr 40px;row-gap:2px}
  .wrow .ko{grid-column:2/3}
  .wrow .star{grid-row:1/3;grid-column:3}
  .mgrid{grid-template-columns:repeat(2,1fr)}
  .card,.panel{padding:20px;border-radius:22px}
  .stat b{font-size:26px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.daynav{position:relative;display:flex;justify-content:center;gap:10px;margin-top:22px}
.daynav button{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:8px 18px;font-weight:600;font-size:14px}
.daynav button:disabled{opacity:.3;cursor:default}
.daygrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.daybtn{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 6px 10px;box-shadow:var(--shadow)}
.daybtn b{font-family:var(--en);font-size:22px;font-weight:800;line-height:1}
.daybtn small{font-size:12px;color:var(--muted);font-weight:600;line-height:1}
.daybtn .mini{width:70%;height:5px;border-radius:9px;background:var(--surface2);overflow:hidden}
.daybtn .mini i{display:block;height:100%;background:var(--grad)}
.daybtn:hover{border-color:var(--accent)}
.daybtn.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 22px rgba(110,75,255,.32)}
.daybtn.on small{color:rgba(255,255,255,.85)} .daybtn.on .mini{background:rgba(255,255,255,.3)} .daybtn.on .mini i{background:#fff}
.daybtn.full:not(.on) b{color:var(--good)}
@media (max-width:420px){.daygrid{grid-template-columns:repeat(4,1fr)}}

.hero .sync{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;font-weight:600;color:rgba(255,255,255,.7);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 14px}
.hero .sync::before{content:'';width:8px;height:8px;border-radius:50%;background:#9AA0B8}
.hero .sync[data-s="ok"]::before{background:#4CC38A;box-shadow:0 0 8px #4CC38A}
.hero .sync[data-s="loading"]::before{background:#F0B44C}
.hero .sync[data-s="err"]::before{background:#FF7A8A}
</style>
</head>
<body>

<section id="home">
  <header class="hero">
    <div class="stars" id="stars"></div>
    <h1>VOCAP</h1>
    <p class="dayname" id="dayTitle">Day 1</p>
    <p>워드마스터 하이퍼 2000 · 40단어</p>
    <p class="sync" id="syncPill" data-s="local">이 기기에만 저장돼요</p>
    <div class="daynav"><button id="prevDay" aria-label="이전 Day">← 이전</button><button id="nextDay" aria-label="다음 Day">다음 →</button></div>
  </header>

  <div class="wrap">
    <div class="sec">
      <h3>Day 고르기</h3>
      <p class="desc">총 25 Day, 1000단어예요. 숫자 아래 막대가 Day별 진행률이에요.</p>
      <div class="daygrid" id="dayGrid"></div>
    </div>
    <div class="sec">
      <h3>어떻게 외울까요?</h3>
      <p class="desc">카드로 훑고, 학습하기로 다지고, 테스트로 확인해요. 지칠 땐 게임으로.</p>
      <div class="modes">
        <button class="mode" data-go="cards"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="3"/><path d="M7 3h11a3 3 0 0 1 3 3v11"/></svg></span><span><b>낱말카드</b><small>뒤집어 보면서 외우기</small></span></button>

let WORDS=[];
function loadDay(n){WORDS=DAYS[n-1].map(([en,ko],i)=>({id:i,en,ko}));}
const norm=s=>s.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
function isAns(given,w){const g=norm(given);return w.en.split(',').some(v=>norm(v)===g);}

const KEY='wmh-day1-v1';
let S={hist:{},star:[],dir:'en',set:'all',best:{},day:1};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s) S=Object.assign(S,s);}catch(e){}
['match','blast','blocks','gems'].forEach(k=>{if(S.best[k]!=null&&S.best['1'+k]==null){S.best['1'+k]=S.best[k];delete S.best[k];}});
function save(){S.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(typeof cloudPush==='function')cloudPush();}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(arr,n,exclude)=>shuffle(arr.filter(x=>x!==exclude)).slice(0,n);

function record(w,ok){const h=S.hist[w.en]||[];h.push(ok?1:0);S.hist[w.en]=h.slice(-2);save();}
function status(w){const h=S.hist[w.en];if(!h||!h.length)return 'n';return (h.length===2&&h[0]&&h[1])?'m':'l';}
function pool(){if(S.set==='star'){const p=WORDS.filter(w=>S.star.includes(w.en));if(p.length>=4)return p;}return WORDS;}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function toggleStar(en){const i=S.star.indexOf(en);i<0?S.star.push(en):S.star.splice(i,1);save();}

/* ---------- home ---------- */
function dayPct(n){const ws=DAYS[n-1];let p=0;ws.forEach(([en])=>{const h=S.hist[en];if(h&&h.length){p+=(h.length===2&&h[0]&&h[1])?1:.5;}});return Math.round(p/ws.length*100);}
function renderDays(){
  $('#dayGrid').innerHTML=DAYS.map((_,i)=>{const n=i+1,p=dayPct(n);
    return `<button class="daybtn${n===S.day?' on':''}${p===100?' full':''}" data-day="${n}" aria-pressed="${n===S.day}"><b>${n}</b><span class="mini"><i style="width:${p}%"></i></span><small>${p}%</small></button>`}).join('');
}
function setDay(n,push){n=Math.max(1,Math.min(DAYS.length,n|0));S.day=n;save();loadDay(n);
  const sw=S.star.filter(e=>WORDS.some(w=>w.en===e));if(S.set==='star'&&sw.length<4){S.set='all';save();}
  if(push){try{history.replaceState(null,'','#day-'+n)}catch(e){location.hash='day-'+n}}
  renderHome();}
function renderHome(){
  document.title='VOCAP · Day '+S.day;
  $('#dayTitle').textContent='Day '+S.day;$('#ovLabel').textContent='Day '+S.day+' 진행률';
  $('#prevDay').disabled=S.day===1;$('#nextDay').disabled=S.day===DAYS.length;
  renderDays();
  let c={n:0,l:0,m:0};
  $('#wlist').innerHTML=WORDS.map(w=>{const s=status(w);c[s]++;const st=S.star.includes(w.en);
    return `<div class="wrow"><span class="dot ${s}"></span><span class="en">${esc(w.en)}</span><span class="ko">${esc(w.ko)}</span><button class="star" data-star="${esc(w.en)}" aria-pressed="${st}" aria-label="별표">${st?'★':'☆'}</button></div>`}).join('');
  $('#sNone').textContent=c.n;$('#sLearn').textContent=c.l;$('#sDone').textContent=c.m;const pct=Math.round((c.m+c.l*.5)/WORDS.length*100);$('#ovPct').textContent=pct+'%';$('#ovBar').style.width=pct+'%';
  document.querySelectorAll('#dirSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dir===S.dir));
  document.querySelectorAll('#setSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.set===S.set));
}
$('#wlist').addEventListener('click',e=>{const b=e.target.closest('[data-star]');if(!b)return;toggleStar(b.dataset.star);renderHome();});
$('#dirSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.dir=b.dataset.dir;save();renderHome();});
$('#setSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.set==='star'&&S.star.filter(e=>WORDS.some(w=>w.en===e)).length<4){alert('이 Day에서 별표를 4개 이상 표시하면 별표 단어만 공부할 수 있어요. 아래 단어 목록에서 ☆를 눌러 주세요.');return;}
  S.set=b.dataset.set;save();renderHome();});
$('#resetBtn').addEventListener('click',()=>{if(confirm('학습 기록을 모두 지울까요? 별표는 남겨 둬요.')){S.hist={};S.best={};save();renderHome();}});

let cleanup=null;
function go(mode){
  if(cleanup){cleanup();cleanup=null;}
  if(!mode){$('#screen').classList.add('hidden');$('#home').classList.remove('hidden');renderHome();window.scrollTo(0,0);return;}
  $('#home').classList.add('hidden');$('#screen').classList.remove('hidden');$('#scRight').innerHTML='';window.scrollTo(0,0);
  ({cards,learn,test,match,blast,blocks,gems})[mode]();
}
document.querySelector('.modes').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go);});
$('#backBtn').addEventListener('click',()=>go(null));
const stage=()=>$('#stage');
const title=t=>$('#scTitle').textContent=t;
const front=w=>S.dir==='en'?w.en:w.ko;
const backOf=w=>S.dir==='en'?w.ko:w.en;

/* ---------- 낱말카드 ---------- */
function cards(list){
  title('낱말카드');
  let deck=list||shuffle(pool()), i=0, known=[], unknown=[], flipped=false;
  const st=stage();
  function draw(){
    if(i>=deck.length){
      st.innerHTML=`<div class="panel done"><h3>한 바퀴 끝!</h3><p>알아요 ${known.length}개, 몰라요 ${unknown.length}개</p>
      <div class="row">${unknown.length?'<button class="btn" id="again">모르는 카드만 다시</button>':''}<button class="btn ghost" id="all">전체 다시</button></div></div>`;
      $('#again')&&($('#again').onclick=()=>cards(shuffle(unknown)));
      $('#all').onclick=()=>cards();return;
    }
    const w=deck[i];flipped=false;const st2=S.star.includes(w.en);
    const fEn=S.dir==='en';
    st.innerHTML=`<div class="tally"><span class="u">몰라요 ${unknown.length}</span><span>${i+1} / ${deck.length}</span><span class="k">알아요 ${known.length}</span></div>
    <div class="bar"><i style="width:${i/deck.length*100}%"></i></div>
    <div class="fcwrap"><div class="fc" id="fc" tabindex="0" role="button" aria-label="카드 뒤집기">
      <div class="face"><div class="${fEn?'big-en':'big-ko'}">${esc(front(w))}</div>
        <div class="corner"><button class="star" id="spk" aria-label="발음 듣기">🔊</button><button class="star" id="stb" aria-pressed="${st2}" aria-label="별표">${st2?'★':'☆'}</button></div>
        <div class="hint">눌러서 뒤집기</div></div>
      <div class="face back"><div class="${fEn?'big-ko':'big-en'}">${esc(backOf(w))}</div><div class="hint">${fEn?esc(w.en):''}</div></div>
    </div></div>
    <div class="row"><button class="btn bad" id="no">몰라요</button><button class="btn good" id="yes">알아요</button></div>

    const fc=$('#fc');
    fc.onclick=e=>{if(e.target.closest('.star'))return;flip();};
    $('#spk').onclick=()=>speak(w.en);
    $('#stb').onclick=e=>{toggleStar(w.en);const on=S.star.includes(w.en);e.target.textContent=on?'★':'☆';e.target.setAttribute('aria-pressed',on);};
    $('#no').onclick=()=>answer(false);$('#yes').onclick=()=>answer(true);
    let sx=null;
    fc.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
    fc.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>70)answer(dx>0);});
  }
  function flip(){flipped=!flipped;$('#fc').classList.toggle('flip',flipped);if(flipped&&S.dir==='ko')speak(deck[i].en);}
  function answer(ok){const w=deck[i];record(w,ok);(ok?known:unknown).push(w);
    const fc=$('#fc');fc.classList.remove('flip');fc.classList.add(ok?'swipe-r':'swipe-l');setTimeout(()=>{i++;draw();},220);}
  function key(e){if(!$('#fc'))return;if(e.code==='Space'){e.preventDefault();flip();}else if(e.key==='ArrowLeft')answer(false);else if(e.key==='ArrowRight')answer(true);}
  document.addEventListener('keydown',key);cleanup=()=>document.removeEventListener('keydown',key);
  draw();
}

/* ---------- 학습하기 ---------- */
function learn(){
  title('학습하기');
  const words=shuffle(pool());
  const lv={};words.forEach(w=>lv[w.en]=0); // 0 객관식, 1 쓰기, 2 완료
  let queue=words.slice(),cur=null;
  const st=stage();
  function bar(){const d=words.filter(w=>lv[w.en]===2).length,h=words.filter(w=>lv[w.en]===1).length;
    return `<div class="tally"><span>익숙해짐 ${h}</span><span>완료 ${d} / ${words.length}</span></div><div class="bar"><i style="width:${(d+h*.5)/words.length*100}%"></i></div>`;}
  function next(){
    if(!queue.length){queue=shuffle(words.filter(w=>lv[w.en]<2));}
    if(!queue.length){st.innerHTML=`<div class="panel done"><h3>모두 완료했어요</h3><p>${words.length}개 단어를 객관식과 쓰기로 한 번씩 통과했어요.</p><div class="row"><button class="btn" id="re">다시 학습하기</button><button class="btn ghost" id="hm">처음으로</button></div></div>`;$('#re').onclick=learn;$('#hm').onclick=()=>go(null);return;}
    cur=queue.shift();
    lv[cur.en]===0?mc():typed();
  }
  function mc(){
    const w=cur,toKo=S.dir==='en',opts=shuffle([w,...pick(words.length>=4?words:WORDS,3,w)]);
    st.innerHTML=bar()+`<div class="panel"><p class="prompt-label">${toKo?'알맞은 뜻을 고르세요':'알맞은 단어를 고르세요'}</p>
    <p class="prompt ${toKo?'en':''}">${esc(toKo?w.en:w.ko)}</p>
    <div class="choices">${opts.map((o,k)=>`<button class="choice ${toKo?'':'en'}" data-k="${k}">${esc(toKo?o.ko:o.en)}</button>`).join('')}</div><div id="fb"></div></div>`;
    if(toKo)speak(w.en);
    st.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      const o=opts[b.dataset.k],ok=o===w;
      st.querySelectorAll('.choice').forEach(x=>{x.disabled=true;if(opts[x.dataset.k]===w)x.classList.add('right');});
      if(!ok)b.classList.add('wrong');
      record(w,ok);
      if(ok){lv[w.en]=1;setTimeout(next,650);}
      else{queue.splice(Math.min(3,queue.length),0,w);$('#fb').innerHTML=`<div class="feedback no">정답은 <span class="en">${esc(w.en)}</span> = ${esc(w.ko)}</div><div class="row" style="margin-top:12px"><button class="btn" id="cont">계속</button></div>`;$('#cont').onclick=next;$('#cont').focus();}
    });
  }
  function typed(){
    const w=cur;
    st.innerHTML=bar()+`<div class="panel"><p class="prompt-label">뜻을 보고 영어 단어를 쓰세요</p><p class="prompt">${esc(w.ko)}</p>
    <form class="typein" id="tf" autocomplete="off" onsubmit="return false"><input id="ti" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력"><button class="btn" type="submit">확인</button></form>
    <div class="row" style="margin-top:10px"><button class="btn ghost" id="idk">모르겠어요</button></div><div id="fb"></div></div>`;
    const ti=$('#ti');ti.focus();
    const check=(given)=>{
      const ok=isAns(given,w);record(w,ok);ti.disabled=true;$('#idk').disabled=true;
      if(ok){$('#fb').innerHTML=`<div class="feedback ok">정답!</div>`;lv[w.en]=2;speak(w.en);setTimeout(next,700);}
      else{queue.splice(Math.min(3,queue.length),0,w);
        $('#fb').innerHTML=`<div class="feedback no">${given.trim()?`내 답: ${esc(given.trim())}<br>`:''}정답: <span class="en">${esc(w.en)}</span></div>
        <div class="row" style="margin-top:12px"><button class="btn ghost" id="mine">오타였어요, 맞은 걸로</button><button class="btn" id="cont">계속</button></div>`;
        speak(w.en);
        $('#cont').onclick=next;$('#mine').onclick=()=>{S.hist[w.en]=(S.hist[w.en]||[]).slice(0,-1).concat([1]);save();lv[w.en]=2;queue=queue.filter(x=>x!==w);next();};
      }
    };
    $('#tf').onsubmit=e=>{e.preventDefault();if(!ti.disabled&&ti.value.trim())check(ti.value);return false;};
    $('#idk').onclick=()=>check('');
  }
  next();
}

  <button class="btn" id="startT" style="width:100%">시험 시작</button></div>`;
  let n=Math.min(10,P.length);

function runTest(words,types){
  const qs=words.map((w,i)=>{const t=types[i%types.length];
    if(t==='mc'){const toKo=S.dir==='en';return {t,w,toKo,opts:shuffle([w,...pick(WORDS,3,w)])};}
    if(t==='tf'){const truth=Math.random()<.5;return {t,w,shown:truth?w:pick(WORDS,1,w)[0],truth};}
    return {t,w};});
  const st=stage();
  st.innerHTML=`<div class="panel"><p class="note">${qs.length}문제. 다 풀고 맨 아래 제출 버튼을 누르세요.</p>`+qs.map((q,i)=>{
    let body='';
    if(q.t==='mc') body=`<p class="prompt ${q.toKo?'en':''}" style="font-size:${q.toKo?'26px':'18px'}">${esc(q.toKo?q.w.en:q.w.ko)}</p><div class="choices">${q.opts.map((o,k)=>`<button class="choice ${q.toKo?'':'en'}" data-q="${i}" data-k="${k}">${esc(q.toKo?o.ko:o.en)}</button>`).join('')}</div>`;
    if(q.t==='tf') body=`<p class="prompt"><span style="font-family:var(--en);font-size:24px">${esc(q.w.en)}</span> = ${esc(q.shown.ko)}</p><div class="tf"><button class="choice" data-q="${i}" data-k="1">O 맞아요</button><button class="choice" data-q="${i}" data-k="0">X 틀려요</button></div>`;
    if(q.t==='wr') body=`<p class="prompt">${esc(q.w.ko)}</p><div class="typein"><input data-q="${i}" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="영어로 입력"></div>`;
    const lab={mc:'객관식',tf:'O/X',wr:'주관식'}[q.t];
    return `<div class="q" id="q${i}"><p class="qn">${i+1}. ${lab}</p>${body}<div class="ans hidden"></div></div>`;}).join('')+
  `<button class="btn" id="submitT" style="width:100%;margin-top:14px">제출하고 채점하기</button></div>`;
  const ans={};
  st.querySelectorAll('.choice[data-q]').forEach(b=>b.onclick=()=>{const i=b.dataset.q;ans[i]=+b.dataset.k;
    st.querySelectorAll(`.choice[data-q="${i}"]`).forEach(x=>x.classList.toggle('sel-a',x===b));
    st.querySelectorAll(`.choice[data-q="${i}"]`).forEach(x=>x.style.outline=x===b?'3px solid var(--accent)':'');});
  $('#submitT').onclick=()=>{
    const blank=qs.filter((q,i)=>q.t==='wr'?!st.querySelector(`input[data-q="${i}"]`).value.trim():ans[i]===undefined).length;
    if(blank&&!confirm(`안 푼 문제가 ${blank}개 있어요. 그래도 제출할까요?`))return;
    let score=0;
    qs.forEach((q,i)=>{let ok=false,el=$('#q'+i),a=el.querySelector('.ans');
      if(q.t==='mc'){ok=q.opts[ans[i]]===q.w;el.querySelectorAll('.choice').forEach(x=>{x.disabled=true;x.style.outline='';if(q.opts[x.dataset.k]===q.w)x.classList.add('right');else if(+x.dataset.k===ans[i])x.classList.add('wrong');});}
      if(q.t==='tf'){ok=(ans[i]===1)===q.truth&&ans[i]!==undefined;el.querySelectorAll('.choice').forEach(x=>{x.disabled=true;x.style.outline='';if((+x.dataset.k===1)===q.truth)x.classList.add('right');else if(+x.dataset.k===ans[i])x.classList.add('wrong');});
        if(!q.truth){a.innerHTML=`<span class="en">${esc(q.w.en)}</span>의 뜻은 ${esc(q.w.ko)}`;a.classList.remove('hidden');}}
      if(q.t==='wr'){const inp=el.querySelector('input');ok=isAns(inp.value,q.w);inp.disabled=true;if(!ok){a.innerHTML=`정답: <span class="en">${esc(q.w.en)}</span>`;a.classList.remove('hidden');}}
      el.classList.add(ok?'correct':'incorrect');if(ok)score++;record(q.w,ok);});
    $('#submitT').remove();
    const wrong=qs.filter((q,i)=>$('#q'+i).classList.contains('incorrect')).map(q=>q.w);
    const box=document.createElement('div');box.className='panel done';box.style.marginBottom='14px';
    box.innerHTML=`<div class="score">${score} / ${qs.length}</div><p style="margin-top:8px">${Math.round(score/qs.length*100)}점</p><div class="row">${wrong.length?'<button class="btn" id="wc">틀린 단어 카드로 보기</button>':''}<button class="btn ghost" id="nt">새 시험</button></div>`;
    st.prepend(box);window.scrollTo({top:0,behavior:'smooth'});
    $('#wc')&&($('#wc').onclick=()=>{if(cleanup){cleanup();cleanup=null;}title('낱말카드');cards(shuffle(wrong));});
    $('#nt').onclick=test;
  };
}

  <div class="mgrid">${tiles.map((t,k)=>`<button class="tile ${t.en?'en':''}" data-k="${k}">${esc(t.en?t.w.en:t.w.ko)}</button>`).join('')}</div>`;
  const tick=()=>{$('#tm')&&($('#tm').textContent=((performance.now()-t0)/1000+pen).toFixed(1)+'초');raf=requestAnimationFrame(tick);};tick();
  cleanup=()=>cancelAnimationFrame(raf);
  stage().querySelectorAll('.tile').forEach(b=>b.onclick=()=>{
    const t=tiles[b.dataset.k];

      if(!left){cancelAnimationFrame(raf);const time=(performance.now()-t0)/1000+pen;const nb=!best||time<best;if(nb){S.best[S.day+'match']=time;save();}
        setTimeout(()=>{stage().innerHTML=`<div class="panel done"><h3>${time.toFixed(1)}초</h3><p>${nb?'새 최고 기록이에요!':`최고 기록 ${best.toFixed(1)}초`}</p><div class="row"><button class="btn" id="re">다시 하기</button><button class="btn ghost" id="hm">처음으로</button></div></div>`;$('#re').onclick=match;$('#hm').onclick=()=>go(null);},300);}
    }else{pen+=1;const a=sel;a.classList.remove('sel');a.classList.add('wrong');b.classList.add('wrong');sel=null;setTimeout(()=>{a.classList.remove('wrong');b.classList.remove('wrong');},450);}
  });
}

/* ---------- Blast ---------- */
function blast(){
  title('Blast');
  const P=pool();let score=0,lives=3,speed=38,rocks=[],target=null,raf,last=performance.now(),over=false;
  stage().innerHTML=`<div class="hud"><span>점수 <b id="bs">0</b></span><span class="lives" id="bl">❤️❤️❤️</span></div>
  <div class="arena" id="ar"><div class="ground"></div></div><div class="target" id="bt"></div>
  <p class="note" style="margin-top:8px;text-align:center">노란 칸의 뜻에 맞는 단어를 바닥에 닿기 전에 누르세요.</p>`;
  const ar=$('#ar');
  function wave(){
    rocks.forEach(r=>r.el.remove());rocks=[];
    target=P[Math.random()*P.length|0];
    const set=shuffle([target,...pick(P.length>=4?P:WORDS,3,target)]);
    $('#bt').textContent=target.ko;
    const W=ar.clientWidth;
    set.forEach((w,k)=>{const el=document.createElement('button');el.className='rock';el.textContent=w.en;ar.appendChild(el);
      const ew=el.offsetWidth;const slot=W/4;let x=Math.max(6,Math.min(W-ew-6,slot*k+(slot-ew)/2+(Math.random()-.5)*20));
      if(W<420)x=Math.max(6,Math.min(W-ew-6,Math.random()*(W-ew)));
      const r={w,el,x,y:-50-Math.random()*90-(W<420?k*55:0)};rocks.push(r);
      el.onclick=()=>hit(r);});
  }
  function hit(r){if(over)return;
    if(r.w===target){score+=10;speed+=3;$('#bs').textContent=score;r.el.classList.add('hit');rocks=rocks.filter(x=>x!==r);setTimeout(()=>{wave();},250);rocks.forEach(x=>x.el.style.pointerEvents='none');}
    else{r.el.classList.add('miss');loseLife();}}
  function loseLife(){lives--;$('#bl').textContent='❤️'.repeat(Math.max(0,lives))+'🤍'.repeat(3-Math.max(0,lives));if(lives<=0)end();}
  function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;const H=ar.clientHeight;
    rocks.forEach(r=>{r.y+=speed*dt;r.el.style.transform=`translate(${r.x}px,${r.y}px)`;});
    const tr=rocks.find(r=>r.w===target);
    if(tr&&tr.y>H-50){loseLife();if(!over)wave();}
    if(!over)raf=requestAnimationFrame(loop);}
  function end(){over=true;cancelAnimationFrame(raf);const best=S.best[S.day+'blast']||0;if(score>best){S.best[S.day+'blast']=score;save();}
    stage().innerHTML=`<div class="panel done"><h3>${score}점</h3><p>${score>best?'새 최고 점수예요!':`최고 점수 ${best}점`}</p><div class="row"><button class="btn" id="re">다시 하기</button><button class="btn ghost" id="hm">처음으로</button></div></div>`;$('#re').onclick=blast;$('#hm').onclick=()=>go(null);}
  wave();raf=requestAnimationFrame(t=>{last=t;loop(t)});
  cleanup=()=>{over=true;cancelAnimationFrame(raf);};
}

/* ---------- 블록 ---------- */
function blocks(){
  title('블록');
  const P=pool();let score=0,stack=[],cur=null,y=0,speed=34,raf,last,over=false,busy=false;
  const BH=40,MAXS=6;
  stage().innerHTML=`<div class="hud"><span>점수 <b id="ks">0</b></span><span id="kh">쌓인 블록 0 / ${MAXS}</span></div>
  <div class="well" id="wl"><div class="stack" id="stk"></div></div>
  <div class="choices" id="kc" style="margin-top:12px"></div>
  <p class="note" style="margin-top:8px;text-align:center">떨어지는 단어의 뜻을 고르면 블록이 깨져요. 틀리거나 바닥에 닿으면 쌓이고, ${MAXS}개가 쌓이면 끝나요.</p>`;
  const wl=$('#wl');
  function spawn(){
    busy=false;cur=P[Math.random()*P.length|0];y=-BH;
    const el=document.createElement('div');el.className='fall';el.id='fall';el.textContent=cur.en;wl.appendChild(el);
    const opts=shuffle([cur,...pick(P.length>=4?P:WORDS,3,cur)]);

    $('#kc').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(busy||over)return;
      if(opts[b.dataset.k]===cur){busy=true;b.classList.add('right');score+=10+Math.round((wl.clientHeight-y)/20);speed+=2.5;$('#ks').textContent=score;const f=$('#fall');f.classList.add('boom');setTimeout(()=>{f.remove();spawn();},260);}
      else{b.classList.add('wrong');land();}});
  }
  function land(){if(busy)return;busy=true;const f=$('#fall');f&&f.remove();stack.push(cur);
    $('#stk').innerHTML=stack.map(w=>`<div class="sblock">${esc(w.en)}</div>`).join('');
    $('#kh').textContent=`쌓인 블록 ${stack.length} / ${MAXS}`;
    if(stack.length>=MAXS)end();else setTimeout(spawn,350);}
  function loop(t){if(over)return;const dt=Math.min(.05,(t-last)/1000);last=t;
    if(!busy&&$('#fall')){y+=speed*dt;$('#fall').style.top=y+'px';const floor=wl.clientHeight-stack.length*BH-BH-6;if(y>=floor)land();}
    raf=requestAnimationFrame(loop);}
  function end(){over=true;cancelAnimationFrame(raf);const best=S.best[S.day+'blocks']||0;if(score>best){S.best[S.day+'blocks']=score;save();}
    const missed=[...new Set(stack)];
    stage().innerHTML=`<div class="panel done"><h3>${score}점</h3><p>${score>best?'새 최고 점수예요!':`최고 점수 ${best}점`}</p>
    <p style="font-size:14px">쌓인 단어: ${missed.map(w=>`<b style="font-family:var(--en)">${esc(w.en)}</b> ${esc(w.ko)}`).join('<br>')}</p>
    <div class="row"><button class="btn" id="re">다시 하기</button><button class="btn ghost" id="hm">처음으로</button></div></div>`;$('#re').onclick=blocks;$('#hm').onclick=()=>go(null);}
  spawn();raf=requestAnimationFrame(t=>{last=t;loop(t)});
  cleanup=()=>{over=true;cancelAnimationFrame(raf);};
}

    $('#gq').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(over)return;
      const ok=opts[b.dataset.k]===w;$('#gq').querySelectorAll('.choice').forEach(x=>x.disabled=true);
      if(ok){combo++;const gain=Math.min(5,1+Math.floor(combo/3));score+=gain;for(let k=0;k<gain;k++)collected.push(COLORS[Math.random()*COLORS.length|0]);b.classList.add('right');}
      else{combo=0;wrongs.push(w);b.classList.add('wrong');$('#gq').querySelectorAll('.choice').forEach(x=>{if(opts[x.dataset.k]===w)x.classList.add('right')});}
      $('#gs').textContent=score;$('#gc').textContent=combo>=3?`${combo}연속 ×${Math.min(5,1+Math.floor(combo/3))}`:'';
      $('#gb').innerHTML=collected.slice(-80).map(c=>`<span class="gem" style="background:${c}"></span>`).join('');
      setTimeout(q,ok?300:900);});
  }
  function tick(){const left=T-(performance.now()-t0)/1000;$('#gt').style.width=Math.max(0,left/T*100)+'%';if(left<=0)return end();raf=requestAnimationFrame(tick);}
  function end(){over=true;cancelAnimationFrame(raf);const best=S.best[S.day+'gems']||0;if(score>best){S.best[S.day+'gems']=score;save();}
    const ws=[...new Set(wrongs)];
    stage().innerHTML=`<div class="panel done"><h3>보석 ${score}개</h3><p>${score>best?'새 최고 기록이에요!':`최고 기록 ${best}개`}</p>
    ${ws.length?`<p style="font-size:14px">틀린 단어: ${ws.map(w=>`<b style="font-family:var(--en)">${esc(w.en)}</b> ${esc(w.ko)}`).join('<br>')}</p>`:''}
    <div class="row"><button class="btn" id="re">다시 하기</button><button class="btn ghost" id="hm">처음으로</button></div></div>`;$('#re').onclick=gems;$('#hm').onclick=()=>go(null);}
  q();tick();cleanup=()=>{over=true;cancelAnimationFrame(raf);};
}

$('#dayGrid').addEventListener('click',e=>{const b=e.target.closest('[data-day]');if(!b)return;setDay(+b.dataset.day,true);document.querySelector('.hero').scrollIntoView({behavior:'smooth'});});
$('#prevDay').onclick=()=>setDay(S.day-1,true);$('#nextDay').onclick=()=>setDay(S.day+1,true);
function fromHash(){const m=/^#day-(\d+)$/.exec(location.hash);if(m){if(cleanup){cleanup();cleanup=null;}$('#screen').classList.add('hidden');$('#home').classList.remove('hidden');setDay(+m[1],false);return true;}return false;}
window.addEventListener('hashchange',fromHash);
if(!fromHash()){loadDay(S.day||1);renderHome();}

/* ---------- 폰·패드 동기화 ---------- */
let uref=null,pushTimer=null,writing=Promise.resolve();
const SYNC_TXT={ok:'폰·패드 동기화 켜짐',loading:'동기화 연결 중',local:'이 기기에만 저장돼요',err:'동기화 끊김, 이 기기엔 저장됨'};
function setSync(k){const el=$('#syncPill');if(!el)return;el.dataset.s=k;el.textContent=SYNC_TXT[k];}
function snapshotState(){return JSON.parse(JSON.stringify({hist:S.hist,star:S.star,best:S.best,dir:S.dir,set:S.set,day:S.day,updated:S.updated||Date.now()}));}
function cloudPush(){if(!uref)return;clearTimeout(pushTimer);pushTimer=setTimeout(()=>{const data=snapshotState();
  writing=writing.then(()=>uref.set(data)).then(()=>setSync('ok')).catch(()=>setSync('err'));},1000);}
function onHome(){return !$('#home').classList.contains('hidden');}
function applyRemote(d){
  S.hist=d.hist||{};S.star=d.star||[];S.best=d.best||{};S.dir=d.dir||S.dir;S.set=d.set||S.set;S.updated=d.updated||0;
  if(onHome()&&d.day){S.day=d.day;}
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(onHome()){loadDay(S.day);renderHome();}
}
function mergeInto(base,extra){ // extra를 base에 합치기: 기록은 base 우선, 별표는 합치고, 최고 기록은 더 좋은 쪽
  const out={...base,hist:{...(extra.hist||{}),...(base.hist||{})},star:[...new Set([...(base.star||[]),...(extra.star||[])])],best:{...(extra.best||{})}};
  for(const [k,v] of Object.entries(base.best||{})){const o=out.best[k];out.best[k]=o==null?v:(k.endsWith('match')?Math.min(o,v):Math.max(o,v));}
  return out;
}
(async()=>{
  if(!window.claude||typeof window.claude.use!=='function'){setSync('local');return;}
  setSync('loading');
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user){setSync('local');return;}
    const id=await user.id();if(!id){setSync('local');return;}
    uref=db.doc('data/users/'+id+'/state');
    const snap=await uref.get();
    const hasLocal=Object.keys(S.hist).length||S.star.length;
    if(snap.exists){
      const d=snap.data();
      const merged=(d.updated||0)>=(S.updated||0)?mergeInto(d,S):mergeInto(snapshotState(),d);
      merged.updated=Date.now();applyRemote(merged);cloudPush();
    }else if(hasLocal){cloudPush();}
    setSync('ok');
    uref.onSnapshot(sn=>{if(!sn.exists)return;const d=sn.data();if((d.updated||0)>(S.updated||0))applyRemote(d);setSync('ok');},()=>setSync('err'));
  }catch(e){setSync('err');}
})();



</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
